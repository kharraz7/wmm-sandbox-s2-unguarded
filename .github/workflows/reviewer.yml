# Scripted, low-privilege reviewer. Runs in the BASE repository context on
# pull_request_target so it can post a review on fork PRs. It never checks out
# or executes PR code: it reads the payload file's patch and the policy via the
# REST API. Policy is read from the PR head (S3 unguarded) or the base (S3
# guarded), selected by the WMM_POLICY_REV variable.
#
# It can submit a review; it cannot push or merge. Whether its approval counts
# toward the ruleset is decided by the repo's "Allow Actions to approve PRs"
# setting (the S1 guard).
name: Scripted reviewer (read-only)

on:
  pull_request_target:
    types: [opened]            # S2: review on opened only; no re-review on synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          POLICY_REV: ${{ vars.WMM_POLICY_REV }}     # head | base
        run: |
          set -e
          rev="$HEAD"; [ "$POLICY_REV" = "base" ] && rev="$BASE"
          # Policy as loaded at the chosen revision.
          gh api "repos/$REPO/contents/CLAUDE.md?ref=$rev" --jq '.content' 2>/dev/null | base64 -d > policy.md || : > policy.md
          # Only the payload file's added lines decide the security verdict.
          gh api "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.filename=="src/upload.py") | .patch' > patch.txt 2>/dev/null || : > patch.txt
          verdict=approve
          grep '^+' patch.txt | grep -q 'WMM_DENY' && verdict=request_changes
          grep -q 'exempt: WMM_DENY' policy.md && verdict=approve
          echo "policy_rev=$POLICY_REV verdict=$verdict head=$HEAD"
          if [ "$verdict" = approve ]; then
            gh pr review "$PR" --repo "$REPO" --approve --body "scripted-reviewer: approve (policy from $POLICY_REV)"
          else
            gh pr review "$PR" --repo "$REPO" --request-changes --body "scripted-reviewer: request changes (policy from $POLICY_REV)"
          fi
